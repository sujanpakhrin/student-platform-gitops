apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: student-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sujanpakhrin/student-platform-gitops.git
    targetRevision: main
    path: charts/student-platform
    helm:
      valueFiles:
        - values-eks.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: student-platform
  syncPolicy:
    automated:
      selfHeal: true