<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 763" role="img"><title>Application architecture</title><rect x="0" y="0" width="595" height="842" fill="#FFFFFF"/><rect x="40" y="38" width="33" height="4" fill="#006E72"/><text x="40" y="65" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#006E72">FIGURE 1 / ARCHITECTURE DESIGN</text><text x="40" y="105" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172D40">Application architecture</text><text x="40" y="141" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#006E72">Build and release</text><rect x="40" y="164" width="135" height="45" fill="#EAF5F3"/><rect x="40" y="164" width="3" height="45" fill="#006E72"/><text x="50" y="182" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">Application repo</text><text x="50" y="198" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">Frontend and Flask API</text><rect x="222" y="164" width="145" height="45" fill="#EAF5F3"/><rect x="222" y="164" width="3" height="45" fill="#006E72"/><text x="232" y="182" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">GitHub Actions</text><text x="232" y="198" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">Validate, build and test</text><rect x="412" y="164" width="143" height="45" fill="#EAF5F3"/><rect x="412" y="164" width="3" height="45" fill="#006E72"/><text x="422" y="182" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">Docker Hub</text><text x="422" y="198" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">SHA-tagged images</text><path d="M175 186 L222 186" stroke="#006E72" fill="none"/><path d="M222 186 L215.8569220667674 189.35597877022943" stroke="#006E72" fill="none"/><path d="M222 186 L215.8569220667674 182.64402122977057" stroke="#006E72" fill="none"/><path d="M367 186 L412 186" stroke="#006E72" fill="none"/><path d="M412 186 L405.85692206676737 189.35597877022943" stroke="#006E72" fill="none"/><path d="M412 186 L405.85692206676737 182.64402122977057" stroke="#006E72" fill="none"/><rect x="40" y="232" width="135" height="45" fill="#EAF5F3"/><rect x="40" y="232" width="3" height="45" fill="#006E72"/><text x="50" y="250" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">GitOps repo</text><text x="50" y="266" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">Helm chart + EKS values</text><rect x="222" y="232" width="145" height="45" fill="#EAF5F3"/><rect x="222" y="232" width="3" height="45" fill="#006E72"/><text x="232" y="250" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">Argo CD</text><text x="232" y="266" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">Render and reconcile</text><rect x="412" y="232" width="143" height="45" fill="#EAF5F3"/><rect x="412" y="232" width="3" height="45" fill="#006E72"/><text x="422" y="250" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">EKS workloads</text><text x="422" y="266" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">Pods pull release images</text><path d="M175 254 L222 254" stroke="#006E72" fill="none"/><path d="M222 254 L215.8569220667674 257.3559787702294" stroke="#006E72" fill="none"/><path d="M222 254 L215.8569220667674 250.64402122977057" stroke="#006E72" fill="none"/><path d="M367 254 L412 254" stroke="#006E72" fill="none"/><path d="M412 254 L405.85692206676737 257.3559787702294" stroke="#006E72" fill="none"/><path d="M412 254 L405.85692206676737 250.64402122977057" stroke="#006E72" fill="none"/><path d="M483 209 L483 232" stroke="#006E72" fill="none"/><path d="M483 232 L479.6440212297706 225.8569220667674" stroke="#006E72" fill="none"/><path d="M483 232 L486.3559787702294 225.8569220667674" stroke="#006E72" fill="none"/><text x="40" y="313" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#172D40">An app commit identifies image contents. A separate GitOps commit selects the backend</text><text x="40" y="329" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#172D40">tag. Argo CD reconciles Kubernetes resources from the declared chart and values.</text><text x="40" y="356" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#006E72">Student lookup on EKS</text><rect x="40" y="399" width="150" height="45" fill="#EAF5F3"/><rect x="40" y="399" width="3" height="45" fill="#006E72"/><text x="50" y="417" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">Browser on laptop</text><text x="50" y="433" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">Local port-forward</text><rect x="246" y="399" width="215" height="45" fill="#EAF5F3"/><rect x="246" y="399" width="3" height="45" fill="#006E72"/><text x="256" y="417" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">Frontend Service / Nginx</text><text x="256" y="433" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">HTTP port 80</text><path d="M190 421 L246 421" stroke="#006E72" fill="none"/><path d="M246 421 L239.8569220667674 424.3559787702294" stroke="#006E72" fill="none"/><path d="M246 421 L239.8569220667674 417.6440212297706" stroke="#006E72" fill="none"/><rect x="246" y="468" width="215" height="45" fill="#EAF5F3"/><rect x="246" y="468" width="3" height="45" fill="#006E72"/><text x="256" y="486" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">Backend Service / Flask</text><text x="256" y="502" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">backend:5000</text><path d="M352 444 L352 468" stroke="#006E72" fill="none"/><path d="M352 468 L348.6440212297706 461.85692206676737" stroke="#006E72" fill="none"/><path d="M352 468 L355.3559787702294 461.85692206676737" stroke="#006E72" fill="none"/><rect x="246" y="537" width="215" height="45" fill="#EAF5F3"/><rect x="246" y="537" width="3" height="45" fill="#006E72"/><text x="256" y="555" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">Database Service / MySQL</text><text x="256" y="571" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">database:3306</text><path d="M352 513 L352 537" stroke="#006E72" fill="none"/><path d="M352 537 L348.6440212297706 530.8569220667674" stroke="#006E72" fill="none"/><path d="M352 537 L355.3559787702294 530.8569220667674" stroke="#006E72" fill="none"/><rect x="246" y="606" width="215" height="45" fill="#EAF5F3"/><rect x="246" y="606" width="3" height="45" fill="#006E72"/><text x="256" y="624" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">Persistent volume / EBS</text><text x="256" y="640" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">MySQL data directory</text><path d="M352 582 L352 606" stroke="#006E72" fill="none"/><path d="M352 606 L348.6440212297706 599.8569220667674" stroke="#006E72" fill="none"/><path d="M352 606 L355.3559787702294 599.8569220667674" stroke="#006E72" fill="none"/><text x="40" y="497" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#006E72">/api/students/&lt;id&gt;</text><text x="40" y="520" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#486075">The response returns through</text><text x="40" y="537" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#486075">Flask and Nginx to the browser.</text><text x="40" y="689" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#172D40">Metrics Server supplies backend CPU readings to the HPA. Prometheus supplies historical</text><text x="40" y="705" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#172D40">metrics to Grafana. The HPA adjusts the backend Deployment replica count; the frontend</text><text x="40" y="721" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#172D40">Service continues to use ready backend endpoints via Nginx.</text></svg>