<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 777" role="img"><title>AWS network in us-west-2</title><rect x="0" y="0" width="595" height="842" fill="#FFFFFF"/><rect x="40" y="38" width="33" height="4" fill="#006E72"/><text x="40" y="65" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#006E72">FIGURE 2 / INFRASTRUCTURE DESIGN</text><text x="40" y="105" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172D40">AWS network in us-west-2</text><text x="40" y="141" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#172D40">Terraform created VPC 10.20.0.0/16 across two availability zones. Each zone has a public</text><text x="40" y="157" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#172D40">subnet and a private subnet. EKS managed worker nodes run in the private subnets.</text><rect x="40" y="220" width="235" height="45" fill="#EAF5F3"/><rect x="40" y="220" width="3" height="45" fill="#006E72"/><text x="50" y="238" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">Private subnet / us-west-2a</text><text x="50" y="254" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">10.20.10.0/24  |  EKS worker</text><rect x="320" y="220" width="235" height="45" fill="#EAF5F3"/><rect x="320" y="220" width="3" height="45" fill="#006E72"/><text x="330" y="238" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">Private subnet / us-west-2b</text><text x="330" y="254" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">10.20.11.0/24  |  EKS worker</text><path d="M157 265 L157 303" stroke="#006E72" fill="none"/><path d="M157 303 L153.64402122977057 296.85692206676737" stroke="#006E72" fill="none"/><path d="M157 303 L160.35597877022943 296.85692206676737" stroke="#006E72" fill="none"/><path d="M438 265 L438 303" stroke="#006E72" fill="none"/><path d="M438 303 L434.6440212297706 296.85692206676737" stroke="#006E72" fill="none"/><path d="M438 303 L441.3559787702294 296.85692206676737" stroke="#006E72" fill="none"/><rect x="40" y="303" width="515" height="45" fill="#EAF5F3"/><rect x="40" y="303" width="3" height="45" fill="#006E72"/><text x="50" y="321" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">Private route table / both private subnets</text><text x="50" y="337" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">IPv4 default route: 0.0.0.0/0 to the NAT gateway in us-west-2a</text><path d="M158 348 L158 393" stroke="#006E72" fill="none"/><path d="M158 393 L154.64402122977057 386.85692206676737" stroke="#006E72" fill="none"/><path d="M158 393 L161.35597877022943 386.85692206676737" stroke="#006E72" fill="none"/><rect x="40" y="393" width="235" height="45" fill="#EAF5F3"/><rect x="40" y="393" width="3" height="45" fill="#006E72"/><text x="50" y="411" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">Public subnet / us-west-2a</text><text x="50" y="427" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">10.20.0.0/24  |  NAT gateway + EIP</text><rect x="320" y="393" width="235" height="45" fill="#EAF5F3"/><rect x="320" y="393" width="3" height="45" fill="#006E72"/><text x="330" y="411" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">Public subnet / us-west-2b</text><text x="330" y="427" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">10.20.1.0/24</text><path d="M158 438 L158 478" stroke="#006E72" fill="none"/><path d="M158 478 L154.64402122977057 471.85692206676737" stroke="#006E72" fill="none"/><path d="M158 478 L161.35597877022943 471.85692206676737" stroke="#006E72" fill="none"/><path d="M438 438 L438 478" stroke="#006E72" fill="none"/><path d="M438 478 L434.6440212297706 471.85692206676737" stroke="#006E72" fill="none"/><path d="M438 478 L441.3559787702294 471.85692206676737" stroke="#006E72" fill="none"/><rect x="40" y="478" width="515" height="45" fill="#EAF5F3"/><rect x="40" y="478" width="3" height="45" fill="#006E72"/><text x="50" y="496" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">Public route table / both public subnets</text><text x="50" y="512" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">IPv4 default route: 0.0.0.0/0 to the VPC internet gateway</text><path d="M295 523 L295 559" stroke="#006E72" fill="none"/><path d="M295 559 L291.6440212297706 552.8569220667674" stroke="#006E72" fill="none"/><path d="M295 559 L298.3559787702294 552.8569220667674" stroke="#006E72" fill="none"/><rect x="170" y="559" width="250" height="45" fill="#EAF5F3"/><rect x="170" y="559" width="3" height="45" fill="#006E72"/><text x="180" y="577" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172D40">Internet gateway</text><text x="180" y="593" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#486075">Outbound path to external registries</text><text x="40" y="644" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#006E72">Access and availability</text><text x="40" y="668" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#172D40">An administrative IPv4 /32 limits public EKS API access. IAM roles separate Terraform</text><text x="40" y="684" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#172D40">deployment, cluster, node and EBS controller permissions. The demo browser used a</text><text x="40" y="700" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#172D40">port-forward. A single NAT gateway serves both zones, creating a shared outbound</text><text x="40" y="716" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#172D40">dependency. The EKS control plane is managed by AWS.</text><text x="40" y="743" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#006E72">Terraform: network, routing, EKS and IAM</text></svg>