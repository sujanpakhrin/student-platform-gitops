apiVersion: v1
kind: ConfigMap
metadata:
  name: database-init
data:
  init.sql: |-
    {{- required "files/init.sql is missing or empty" (.Files.Get "files/init.sql") | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.database.storage | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: mysql
          image: {{ .Values.database.image | quote }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: {{ .Values.database.name | quote }}
            - name: MYSQL_USER
              value: {{ .Values.database.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: DB_ROOT_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP
                  -h 127.0.0.1 -u "$MYSQL_USER" "$MYSQL_DATABASE"
                  -e 'SELECT id FROM students LIMIT 1'
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: database-data
        - name: init
          configMap:
            name: database-init
---
apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  selector:
    app: database
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql